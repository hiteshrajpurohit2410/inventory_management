{% extends "base.html" %}
{% block title %}{{ 'Edit' if supplier else 'Add' }} supplier — Inventory MS{% endblock %}
{% block content %}
<h1 class="page-title">{{ 'Edit supplier' if supplier else 'Add supplier' }}</h1>
<form method="post" class="form-card">
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required value="{{ supplier.name if supplier else '' }}">
  </div>
  <div class="form-group">
    <label for="contact">Contact</label>
    <input type="text" id="contact" name="contact" required value="{{ supplier.contact if supplier else '' }}">
  </div>
  <div class="form-group">
    <label for="address">Address</label>
    <textarea id="address" name="address" rows="3" required>{{ supplier.address if supplier else '' }}</textarea>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('suppliers.list_suppliers') }}" class="btn btn-ghost">Cancel</a>
  </div>
</form>
{% endblock %}
