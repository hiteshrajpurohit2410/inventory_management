{% extends "base.html" %}
{% block title %}Categories — Inventory MS{% endblock %}
{% block content %}
<h1 class="page-title">Categories</h1>
<div class="toolbar">
  <a href="{{ url_for('categories.add') }}" class="btn btn-primary">Add category</a>
</div>
<div class="table-wrap">
  <table class="data-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th style="width:180px;">Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for c in categories %}
      <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.name }}</td>
        <td>
          <a href="{{ url_for('categories.edit', category_id=c.id) }}" class="btn btn-ghost" style="padding:0.35rem 0.65rem;">Edit</a>
          <form method="post" action="{{ url_for('categories.delete', category_id=c.id) }}" style="display:inline;" onsubmit="return confirm('Delete this category?');">
            <button type="submit" class="btn btn-danger" style="padding:0.35rem 0.65rem;">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="muted">No categories yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
